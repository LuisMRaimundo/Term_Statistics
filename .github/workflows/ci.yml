name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact model wheels (not `spacy download`) — golden locks depend on weights.
  EN_MODEL_WHL: https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
  PT_MODEL_WHL: https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl
  FR_MODEL_WHL: https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Cache spaCy model wheels
        uses: actions/cache@v4
        with:
          path: .spacy-wheels
          key: spacy-wheels-en-pt-fr-3.8.0

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -c constraints.txt -r requirements.txt
          python -c "import click, spacy; print('click', click.__version__, 'spacy', spacy.__version__)"

      - name: Install pinned spaCy models (3.8.0 wheels)
        shell: bash
        run: |
          mkdir -p .spacy-wheels
          if [ ! -f .spacy-wheels/en_core_web_sm-3.8.0-py3-none-any.whl ]; then
            python -c "from urllib.request import urlretrieve; urlretrieve('${{ env.EN_MODEL_WHL }}', '.spacy-wheels/en_core_web_sm-3.8.0-py3-none-any.whl')"
          fi
          if [ ! -f .spacy-wheels/pt_core_news_sm-3.8.0-py3-none-any.whl ]; then
            python -c "from urllib.request import urlretrieve; urlretrieve('${{ env.PT_MODEL_WHL }}', '.spacy-wheels/pt_core_news_sm-3.8.0-py3-none-any.whl')"
          fi
          if [ ! -f .spacy-wheels/fr_core_news_sm-3.8.0-py3-none-any.whl ]; then
            python -c "from urllib.request import urlretrieve; urlretrieve('${{ env.FR_MODEL_WHL }}', '.spacy-wheels/fr_core_news_sm-3.8.0-py3-none-any.whl')"
          fi
          pip install --no-deps .spacy-wheels/en_core_web_sm-3.8.0-py3-none-any.whl
          pip install --no-deps .spacy-wheels/pt_core_news_sm-3.8.0-py3-none-any.whl
          pip install --no-deps .spacy-wheels/fr_core_news_sm-3.8.0-py3-none-any.whl
          python -c "import spacy; print('spacy', spacy.__version__); spacy.load('en_core_web_sm'); spacy.load('pt_core_news_sm'); spacy.load('fr_core_news_sm'); print('models ok')"

      - name: Ruff
        run: ruff check textura tests textura_near.py textura_analise.py textura_triagem.py textura_lexico.py textura_query.py textura_concordancia_qa.py

      - name: Pytest (incl. EN + PT + FR golden chains)
        env:
          CI: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q --tb=short
        # DOCX golden leg uses python-docx only (--no-paginas-pdf); no Office runtime.
